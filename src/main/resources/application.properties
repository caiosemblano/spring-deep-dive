# 0. Configurações do Servidor
server.port=8081

# 1. Configurações de Conexão com o Banco
spring.datasource.url=jdbc:mysql://localhost:3307/spring-deep-dive?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:caio}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. Configurações do Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring-deep-dive.jwtSecret=${JWT_SECRET}
spring-deep-dive.jwtExpirationInMs=900000

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true